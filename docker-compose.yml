services:
  # ElectionDesk Full-Stack Application Node
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/electiondesk?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET:-please_set_jwt_secret_in_env_file_2026}
      - STEP_UP_JWT_SECRET=${STEP_UP_JWT_SECRET:-please_set_step_up_secret_2026}
      - COOKIE_SECRET=${COOKIE_SECRET:-please_set_cookie_secret_2026}
      - CORS_ORIGIN=https://electiondesk.gov
      - STORAGE_DIR=/var/data/electiondesk/voter_photos
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - voter_photo_storage:/var/data/electiondesk/voter_photos
    networks:
      - internal_network
    depends_on:
      mongo:
        condition: service_healthy

  # Private Database Tier (Inaccessible from host network)
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    networks:
      - internal_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Reverse Proxy & TLS Termination
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - internal_network
    depends_on:
      - app

volumes:
  mongo_data:
    driver: local
  voter_photo_storage:
    driver: local

networks:
  internal_network:
    driver: bridge
